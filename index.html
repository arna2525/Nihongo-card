<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kotoba Card">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Kotoba Card</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Shippori+Mincho:wght@400;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1026;--card:#162044;--line:#243063;--tx:#F8FAFC;--mu:#94a3c4;--gold:#FACC15;--ok:#10B981;--bad:#EF4444;--jp:"Zen Maru Gothic","Hiragino Sans","Noto Sans JP",sans-serif;--z:1.2;--y:1.4;color-scheme:dark;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;min-height:100%;}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100%;height:100%;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{height:100vh;height:100dvh;min-height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;min-height:0;overflow:auto;padding:26px 16px calc(96px + env(safe-area-inset-bottom,0px));position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
nav{position:fixed;z-index:1000;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);display:flex;background:var(--card);border-top:1px solid var(--line);padding:0 0 calc(env(safe-area-inset-bottom,0px) + 2px);}
nav button{flex:1;padding:11px 4px;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;cursor:pointer}
nav button.on{color:var(--gold);font-weight:700}
h1{font-size:20px;margin:0}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:14px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;margin-top:8px}
.btn{padding:12px 16px;border-radius:14px;border:0;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;margin-top:8px}
.btn.gold{background:var(--gold);color:#0B1026;font-weight:700;width:100%}
.box{background:var(--card);border-radius:18px;padding:14px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);color:#0B1026;border-color:var(--gold);font-weight:700}
.w{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.w:last-child{border:0}
.jp{font-family:var(--jp)}
.x{background:none;border:0;color:var(--bad);font-size:14px;cursor:pointer}
.card{background-color:var(--card);background-image:radial-gradient(circle at 50% 100%,transparent 36%,rgba(255,255,255,.06) 37%,rgba(255,255,255,.06) 40%,transparent 41%,transparent 57%,rgba(255,255,255,.06) 58%,rgba(255,255,255,.06) 61%,transparent 62%);background-size:44px 22px;border-radius:26px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card .big{font-family:var(--jp);font-size:46px;line-height:1.3;word-break:break-word}
.card .big.kz{font-size:calc(46px*var(--z))}
.card .sub{margin-top:14px;padding-top:14px;border-top:2px dotted var(--mu);width:80%;color:var(--mu);font-size:15px}
.fur{color:var(--gold);font-family:var(--jp);font-size:calc(28px*var(--y));margin-bottom:8px}
.flip{perspective:1000px;cursor:pointer;margin-top:16px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.in{position:relative;min-height:240px;transition:transform .45s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.in.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(0);box-shadow:none}
.face.bk{transform:rotateY(180deg)}
.ev{display:none;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:16px}
.ev.show{display:grid}
.ev button{padding:12px 2px;border:0;border-radius:14px;font:inherit;font-size:14px;font-weight:700;color:#0B1026;cursor:pointer}
.bar{height:26px;border-radius:999px;background:var(--line);overflow:hidden;position:relative;margin-top:14px}
.fill{height:100%;background:var(--gold);transition:width .3s;min-width:46px;border-radius:999px;color:#0B1026;font-weight:700;font-size:14px;padding:3px 12px}
.dots{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:#33406e}
.dot.d{background:var(--gold)}.dot.c{background:var(--tx)}
.opt{display:block;width:100%;padding:16px;margin-top:10px;border-radius:999px;border:0;background:var(--card);color:var(--tx);font:inherit;font-size:17px;cursor:pointer;font-family:var(--jp)}
.opt.ok{background:var(--ok)}.opt.bad{background:var(--bad)}
.opt.kj{font-size:38px;padding:12px 16px;line-height:1.35}
.ev small{display:block;font-weight:400;font-size:11px;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card);border-radius:18px;padding:14px}
.stat b{display:block;font-size:26px;color:var(--gold);font-weight:700}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:10px}
.bar1{flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;font-size:12px;color:var(--mu);gap:3px}
.bar1 i{display:block;background:var(--gold);border-radius:6px 6px 0 0;min-height:3px}
.tag{padding:8px 16px;border-radius:999px;background:#1b2b66;color:#6ea8fe;font-size:15px}
.pg.n,.pg.l,.pg.f{animation:pageFade .15s ease-out both}
.pg.o{position:absolute;left:16px;right:16px;top:16px;animation:pageFadeOut .12s ease-in both;pointer-events:none}
.pg.o.r,.pg.o.f{animation-name:pageFadeOut}
@keyframes pageFade{from{opacity:0}to{opacity:1}}
@keyframes pageFadeOut{from{opacity:1}to{opacity:0}}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{50%{transform:scale(1.03)}}
button{transition:transform .12s,background-color .25s,opacity .2s}
button:active{transform:scale(.96)}
nav button:active{transform:none}
nav button{position:relative}
nav button:after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:3px;border-radius:3px;background:var(--gold);transform:scaleX(0);transition:transform .28s}
nav button.on:after{transform:scaleX(1)}
.opt.bad{animation:shk .32s}
.opt.ok{animation:pop .32s}
@media(prefers-reduced-motion:reduce){.pg,.opt{animation:none!important}.in{transition:none}}

/* NIHONGO QUEST-inspired visual polish */
:root{--bg:#0a1024;--card:#151f3d;--line:#29375f;--tx:#f8f7ff;--mu:#a8b2cc;--gold:#f5c96a;--pink:#f2a9c4;--ok:#43c59e}
body{background:radial-gradient(ellipse at 85% 0%,rgba(108,85,151,.20),transparent 38%),var(--bg)}
main{padding-top:18px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.box,.stat{border:1px solid rgba(173,190,235,.08);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.box{border-radius:20px}
.btn{border:1px solid rgba(173,190,235,.09);border-radius:15px}
.btn.gold{background:linear-gradient(135deg,#f5d58a,#e9ad79);box-shadow:0 5px 16px rgba(233,173,121,.18)}
.chip{border-color:rgba(173,190,235,.13)}
.chip.on{background:linear-gradient(135deg,#f5d58a,#e9ad79);border-color:transparent}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:112px;padding:17px 18px;margin:0 0 16px;border:1px solid rgba(242,169,196,.22);border-radius:23px;background:linear-gradient(112deg,#20294d 0%,#342b55 58%,#53334f 100%);box-shadow:0 12px 28px rgba(0,0,0,.2)}
.hero:before,.hero:after{content:"✿";position:absolute;color:rgba(255,205,222,.32);font-size:40px;pointer-events:none}
.hero:before{right:72px;top:-13px;transform:rotate(18deg)}
.hero:after{right:20px;bottom:-17px;font-size:54px;transform:rotate(-18deg)}
.hero-copy{position:relative;z-index:1;min-width:0}
.hero-kicker{font-size:10px;letter-spacing:2px;color:#f5c9d8;font-weight:700}
.hero-title{font-size:19px;font-weight:800;line-height:1.25;margin-top:4px;color:#fff}
.hero-sub{font-size:11px;color:#d7d3e8;margin-top:5px}
.hero-mascot{position:relative;z-index:1;flex:0 0 76px;width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.2);font-size:43px;box-shadow:inset 0 1px rgba(255,255,255,.18)}
h1{letter-spacing:-.3px}
nav{background:rgba(21,31,61,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(173,190,235,.13);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 2px)}
/* Extend the bottom navigation surface behind the iPhone Home Indicator */
body:after{content:"";position:fixed;z-index:999;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 104px);background:rgba(21,31,61,.97);pointer-events:none}
nav{z-index:1000}
nav button{font-size:13px;padding:10px 4px}
.card{background-color:#182345;background-image:radial-gradient(circle at 50% 100%,transparent 36%,rgba(242,169,196,.08) 37%,rgba(242,169,196,.08) 40%,transparent 41%,transparent 57%,rgba(242,169,196,.08) 58%,rgba(242,169,196,.08) 61%,transparent 62%);box-shadow:0 12px 28px rgba(0,0,0,.25)}
.tag{background:rgba(242,169,196,.13);color:#f4bfd1;border:1px solid rgba(242,169,196,.18)}

if(gear)h+='<div class="box"><label class="mu">Jenis font Jepang</label><select onchange="S.font=this.value;applyFont();save();R()"><option value="std"'+(S.font==="std"?" selected":"")+'>Standar / Rounded</option><option value="min"'+(S.font==="min"?" selected":"")+'>Klasik / Mincho</option><option value="hand"'+(S.font==="hand"?" selected":"")+'>Tulisan tangan</option></select><label class="mu" style="display:block;margin-top:14px">Ukuran kanji flashcard</label><input type="range" min="1" max="2" step="0.1" value="'+(S.size||1.2)+'" oninput="S.size=+this.value;applyFont();save()"><div class="jp" style="text-align:center;font-size:calc(46px*var(--z));margin-top:8px">日本語</div><label class="mu" style="display:block;margin-top:14px">Ukuran furigana (kuning)</label><input type="range" min="1" max="2.4" step="0.1" value="'+(S.fsize||1.4)+'" oninput="S.fsize=+this.value;applyFont();save()"><div class="fur" style="text-align:center;margin-top:8px">にほんご</div></div><div class="box"><div class="mu">Cadangan data</div><div class="row"><button class="btn" onclick="bkExp()">Ekspor</button><button class="btn" onclick="bkImp(this)">Impor</button></div><div class="mu" id="bm"></div><textarea id="bk" placeholder="Ekspor menampilkan cadangan di sini. Untuk impor, tempel cadangan lalu ketuk Impor." style="width:100%;height:90px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:10px;font:12px monospace"></textarea></div>';
h+='<div class="box">'+(gear?'<div class="mu">Folder baru</div><div class="row"><input id="fn" placeholder="Contoh: Kanji N5"><button class="btn" onclick="addFolder()">Buat</button></div>':'')+'<div class="chips">';
S.folders.forEach(function(x){h+='<button class="chip'+(x.id===S.active?" on":"")+'" onclick="pick(\''+x.id+'\')">'+e(x.name)+' ('+x.words.length+')</button>'});
h+='</div>';
if(f&&gear)h+='<button class="x" style="margin-top:10px" onclick="delFolder()">'+(arm===f.id?"Yakin hapus folder ini? Ketuk lagi":"Hapus folder aktif")+'</button>';
h+='</div>';
if(f){if(gear)h+='<div class="box"><div class="mu">Tambah kosakata ke '+e(f.name)+'</div><input id="ik" placeholder="Kanji / Kotoba"><input id="if" placeholder="Furigana (cara baca)"><input id="ia" placeholder="Arti (Bahasa Indonesia)"><button class="btn gold" onclick="addWord()">Tambah</button></div>';h+='<div class="box vocab-panel"><div class="mu vocab-count">'+f.words.length+' kata</div>';
f.words.forEach(function(w){h+='<div class="w"><div><span class="jp" style="font-size:20px">'+e(w.k)+'</span> <span class="jp" style="color:var(--gold)">'+e(w.f)+'</span><div class="mu">'+e(w.a)+'</div></div>'+(gear?'<button class="x" onclick="delWord(\''+w.id+'\')">Hapus</button>':'')+'</div>'});
h+='</div>'}
return h}
function pick(id){S.active=id;arm=null;L=null;Q=null;save();R()}
function addFolder(){var n=document.getElementById("fn").value.trim();if(!n)return;var f={id:uid(),name:n,words:[]};S.folders.push(f);S.active=f.id;L=null;Q=null;save();R()}
function delFolder(){var f=cur();if(!f)return;if(arm!==f.id){arm=f.id;R();return}S.folders=S.folders.filter(function(x){return x.id!==f.id});S.active=S.folders.length?S.folders[0].id:null;arm=null;L=null;Q=null;save();R()}
function addWord(){var f=cur(),k=document.getElementById("ik").value.trim(),r=document.getElementById("if").value.trim(),a=document.getElementById("ia").value.trim();if(!f||!k||!a)return;f.words.push({id:uid(),k:k,f:r||k,a:a});L=null;Q=null;save();R()}
function delWord(id){var f=cur();f.words=f.words.filter(function(w){return w.id!==id});L=null;Q=null;save();R()}

function today(){return Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5)}
function sr(w,r){var i=w.ivl||0,z=w.ease||2.5;if(r===0)return{ivl:0,ease:Math.max(1.3,z-.2)};if(r===1)return{ivl:Math.max(1,Math.round(i*1.2)),ease:Math.max(1.3,z-.15)};if(r===2)return{ivl:i<1?2:Math.round(i*z),ease:z};return{ivl:i<1?4:Math.round(i*z*1.3),ease:z+.15}}
function iv(w,r){if(L.cram)return"";var s=sr(w,r).ivl;return s<1?"segera":s+" hari"}
function stat(k,ok){var t=today();S.st=S.st||{};var d=S.st[t]=S.st[t]||{r:0,g:0,q:0,qo:0};if(k==="q"){d.q++;if(ok)d.qo++}else{d.r++;if(ok)d.g++}save()}
function startL(all){var f=cur(),t=today(),ws=all?f.words:f.words.filter(function(w){return !w.due||w.due<=t});L={fid:f.id,cram:!!all,q:shuf(ws.map(function(w){return w.id})),total:ws.length}}
function fm(s){if(s<60)return s?"<1 mnt":"0 mnt";if(s<3600)return Math.floor(s/60)+" mnt";return Math.floor(s/3600)+" j "+Math.floor(s%3600/60)+" mnt"}
function vStat(){var t=today(),st=S.st||{},d=st[t]||{r:0,g:0,q:0,qo:0},due=0,mt=0,i,s=0,k,tot=0,v=[],mx=1,dy=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
Object.keys(st).forEach(function(x){tot+=st[x].s||0});
S.folders.forEach(function(f){f.words.forEach(function(w){if(!w.due||w.due<=t)due++;if((w.ivl||0)>=21)mt++})});
k=(st[t]&&(st[t].r+st[t].q))?t:t-1;while(st[k]&&(st[k].r+st[k].q)>0){s++;k--}
for(i=6;i>=0;i--){var x=st[t-i]||{},m=Math.ceil((x.s||0)/60);v.push([dy[new Date((t-i)*864e5).getUTCDay()],m]);mx=Math.max(mx,m)}
var h=hero()+'<h1>Statistik</h1><div class="box"><div class="mu">Hari ini</div><div style="font-size:40px;font-weight:700;color:var(--gold);line-height:1.2">'+fm(d.s||0)+'</div><div class="mu">Flashcard '+d.r+' kartu'+(d.r?' ('+Math.round(d.g/d.r*100)+'% benar)':'')+' · Kuis '+d.q+' soal'+(d.q?' ('+Math.round(d.qo/d.q*100)+'% benar)':'')+'</div></div>';
h+='<div class="grid"><div class="stat"><b>'+fm(tot)+'</b><span class="mu">Total waktu belajar</span></div><div class="stat"><b>'+s+' hari</b><span class="mu">Runtutan</span></div><div class="stat"><b>'+due+'</b><span class="mu">Kartu jatuh tempo</span></div><div class="stat"><b>'+mt+'</b><span class="mu">Kata dikuasai</span></div></div>';
h+='<div class="box"><div class="mu">Waktu belajar 7 hari (menit)</div><div class="bars">';
v.forEach(function(a){h+='<div class="bar1"><span>'+a[1]+'</span><i style="height:'+Math.round(a[1]/mx*80)+'px"></i>'+a[0]+'</div>'});
return h+'</div></div>'}
function vStatOld(){var t=today(),st=S.st||{},d=st[t]||{r:0,g:0,q:0,qo:0},tot=0,due=0,lr=0,mt=0,i,s=0,k,dy=["Min","Sen","Sel","Rab","Kam","Jum","Sab"],v=[],mx=1,w7=0;
S.folders.forEach(function(f){f.words.forEach(function(w){tot++;if(!w.due||w.due<=t)due++;if(w.due)lr++;if((w.ivl||0)>=21)mt++})});
k=(st[t]&&(st[t].r+st[t].q))?t:t-1;while(st[k]&&(st[k].r+st[k].q)>0){s++;k--}
for(i=6;i>=0;i--){var x=st[t-i]||{r:0,q:0};w7+=x.s||0;v.push([dy[new Date((t-i)*864e5).getUTCDay()],x.r+x.q]);mx=Math.max(mx,x.r+x.q)}
function bx(n,l){return '<div class="stat"><b>'+n+'</b><span class="mu">'+l+'</span></div>'}
var h='<h1>Statistik</h1><div class="grid">'+bx(s+" hari","Runtutan belajar")+bx(due,"Kartu jatuh tempo")+bx(d.r?Math.round(d.g/d.r*100)+"%":"-","Flashcard hari ini ("+d.r+")")+bx(d.q?Math.round(d.qo/d.q*100)+"%":"-","Kuis hari ini ("+d.q+")")+bx(fm(d.s||0),"Waktu belajar hari ini")+bx(fm(w7),"Waktu belajar 7 hari")+bx(lr+" / "+tot,"Kata sudah dipelajari")+bx(mt,"Kata dikuasai")+'</div><div class="box"><div class="mu">Aktivitas 7 hari terakhir</div><div class="bars">';
v.forEach(function(a){h+='<div class="bar1"><span>'+a[1]+'</span><i style="height:'+Math.round(a[1]/mx*80)+'px"></i>'+a[0]+'</div>'});
return h+'</div></div>'}
var bkArm=false;
function bkm(t){document.getElementById("bm").textContent=t}
function bkExp(){var t=document.getElementById("bk");t.value=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(function(){bkm("Tersalin. Simpan di catatan atau kirim ke dirimu sendiri.")},function(){bkm("Salin teks di bawah secara manual.");t.focus();t.select()})}else{bkm("Salin teks di bawah secara manual.");t.focus();t.select()}}
function bkImp(b){var t=document.getElementById("bk"),d;try{d=JSON.parse(t.value)}catch(x){}
if(!d||!d.folders||!d.folders.length){bkm("Cadangan tidak valid.");return}
if(!bkArm){bkArm=true;b.textContent="Yakin timpa? Ketuk lagi";setTimeout(function(){bkArm=false;b.textContent="Impor"},4000);return}
S=d;S.active=S.active||S.folders[0].id;L=null;Q=null;bkArm=false;applyFont();save();R()}
function vLearn(){var f=cur();if(!f||!f.words.length)return empty("Tambahkan kosakata dulu di tab Folder.");
if(!L||L.fid!==f.id)startL();
if(!L.q.length)return '<div class="card"><div class="big">おつかれさま！</div><p class="mu">'+(L.total?'Semua kartu selesai ('+L.total+' kartu)':'Tidak ada kartu jatuh tempo hari ini')+'</p></div><button class="btn gold" onclick="startL(true);R()">Latihan semua kartu (tanpa jadwal)</button>';
var w=f.words.filter(function(x){return x.id===L.q[0]})[0];if(!w){L.q.shift();return vLearn()}
return hero()+'<div class="row sp"><span class="tag">'+e(f.name)+'</span><span class="mu">'+L.q.length+' kartu tersisa</span></div><div class="flip" onclick="flipC()"><div class="in" id="in"><div class="face card"><div class="big kz">'+e(w.k)+'</div><div class="sub">Ketuk untuk membalik</div></div><div class="face bk card"><div class="fur">'+e(w.f)+'</div><div style="font-size:22px">'+e(w.a)+'</div></div></div></div><div class="ev" id="ev"><button style="background:var(--bad)" onclick="rate(0)">Ulangi<small>'+iv(w,0)+'</small></button><button style="background:#F97316" onclick="rate(1)">Sulit<small>'+iv(w,1)+'</small></button><button style="background:var(--ok)" onclick="rate(2)">Bagus<small>'+iv(w,2)+'</small></button><button style="background:#3B82F6" onclick="rate(3)">Mudah<small>'+iv(w,3)+'</small></button></div>'}
function flipC(){document.getElementById("in").classList.toggle("f");document.getElementById("ev").classList.add("show")}
function rate(r){var id=L.q.shift(),w=cur().words.filter(function(x){return x.id===id})[0];if(w){stat("r",r>=2);if(!L.cram){var s=sr(w,r);w.ivl=s.ivl;w.ease=s.ease;w.due=today()+s.ivl;save()}}if(r===0)L.q.splice(Math.min(2,L.q.length),0,id);else if(r===1)L.q.splice(Math.min(5,L.q.length),0,id);R("n")}

function retry(){var b=Q.ws.filter(function(w,i){return !Q.res[i]}).map(function(w){return w.id});startQ(Q.mode,b)}
function startQ(mode,ids){var f=cur(),src=ids?f.words.filter(function(w){return ids.indexOf(w.id)>-1}):f.words;Q={fid:f.id,mode:mode,ws:shuf(src).slice(0,20),pool:f.words,i:0,res:[],lock:false,o:null};R("n")}
function lab(x){return Q.mode==="arti"?x.a:x.k}
function vQuiz(){var f=cur();if(!f||f.words.length<2)return empty("Kuis butuh minimal 2 kata di folder aktif.");
if(!Q||Q.fid!==f.id)return hero()+'<h1>Kuis</h1><div class="box"><div class="mu">Folder: '+e(f.name)+' ('+f.words.length+' kata)</div><button class="btn gold" onclick="startQ(\'arti\')">Tebak Arti</button><button class="btn gold" onclick="startQ(\'kanji\')">Tebak Kanji</button></div>';
var n=Q.ws.length;
if(Q.i>=n){var sc=Q.res.filter(Boolean).length,pc=Math.round(sc/n*100),bad=Q.ws.filter(function(w,i){return !Q.res[i]}),h2='<div class="card"><div class="big" style="color:var(--gold)">'+pc+'%</div><p class="mu">Benar '+sc+' dari '+n+' soal</p></div>';
h2+=bad.length?'<div class="box"><div class="mu">Kata yang salah ('+bad.length+')</div>'+bad.map(function(w){return '<div class="w"><div><span class="jp" style="font-size:22px">'+e(w.k)+'</span> <span class="jp" style="color:var(--gold)">'+e(w.f)+'</span><div class="mu">'+e(w.a)+'</div></div></div>'}).join("")+'</div>':'<div class="box mu">Semua jawaban benar. Mantap!</div>';
return h2+(bad.length?'<button class="btn gold" onclick="retry()">Latih yang salah</button>':'')+'<button class="btn gold" style="background:var(--card);color:var(--tx)" onclick="startQ(\''+Q.mode+'\')">Main lagi</button><button class="btn gold" style="background:var(--card);color:var(--tx)" onclick="Q=null;R()">Selesai</button>'}
var c=Q.ws[Q.i];
if(!Q.o||Q.oi!==Q.i){var seen={},oth=[];shuf(Q.pool).forEach(function(x){var l=lab(x);if(x.id!==c.id&&l!==lab(c)&&!seen[l]){seen[l]=1;oth.push(x)}});Q.o=shuf([c].concat(oth.slice(0,3)));Q.oi=Q.i}
var pct=Math.round(Q.res.length/n*100),d="";for(var i=0;i<n;i++)d+='<span class="dot'+(i<Q.res.length?" d":i===Q.i?" c":"")+'" id="d'+i+'"></span>';
var main=Q.mode==="arti"?'<div class="big">'+e(c.k)+'</div>':'<div class="big" style="font-size:28px;font-family:system-ui">'+e(c.a)+'</div>';
var h='<div class="row sp"><button class="btn" style="margin:0" onclick="Q=null;R()">\u2190 Keluar</button><span class="tag">'+e(f.name)+'</span></div><div class="bar"><div class="fill" id="fl" style="width:'+pct+'%">'+pct+'%</div></div><div class="dots">'+d+'</div><div class="flip" onclick="this.firstElementChild.classList.toggle(\'f\')"><div class="in" style="min-height:190px"><div class="face card" style="min-height:0">'+main+'<div class="sub">'+(Q.mode==="arti"?"Pilih Arti":"Pilih Kanji")+' · ketuk untuk lihat bacaan</div></div><div class="face bk card" style="min-height:0"><div class="fur">'+e(c.f)+'</div><div class="big" style="font-size:42px">'+e(c.k)+'</div></div></div></div>';
Q.o.forEach(function(x,k){h+='<button class="opt'+(Q.mode==="kanji"?" kj":"")+'" id="o'+k+'" onclick="ans('+k+')">'+e(lab(x))+'</button>'});
return h}
function ans(k){if(Q.lock)return;Q.lock=true;var c=Q.ws[Q.i],ok=Q.o[k].id===c.id;Q.res.push(ok);stat("q",ok);
document.getElementById("o"+k).classList.add(ok?"ok":"bad");
if(!ok)Q.o.forEach(function(x,j){if(x.id===c.id)document.getElementById("o"+j).classList.add("ok")});
var p=Math.round(Q.res.length/Q.ws.length*100),fl=document.getElementById("fl");fl.style.width=p+"%";fl.textContent=p+"%";
document.getElementById("d"+Q.i).className="dot d";
setTimeout(function(){if(!Q)return;Q.i++;Q.lock=false;R("n")},600)}
document.addEventListener("click",function(ev){var a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&!ev.target.closest("input,select"))a.blur()});
document.addEventListener("keydown",function(ev){if(ev.key!=="Enter")return;var a=document.activeElement;if(a&&a.id==="ia")addWord();else if(a&&a.id==="fn")addFolder()});
var lastAct=Date.now(),tk6=0;
["pointerdown","keydown","touchstart"].forEach(function(n){document.addEventListener(n,function(){lastAct=Date.now()},true)});
setInterval(function(){if(document.hidden||(T!=="learn"&&T!=="quiz")||Date.now()-lastAct>60000)return;var t=today();S.st=S.st||{};var d=S.st[t]=S.st[t]||{r:0,g:0,q:0,qo:0};d.s=(d.s||0)+5;if(++tk6%6===0)save()},5000);
document.addEventListener("visibilitychange",function(){if(document.hidden)save()});
load();applyFont();R();
</script></body></html>
