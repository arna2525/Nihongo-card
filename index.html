<title>Manabi</title>

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;0,800;1,500;1,800&family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&family=Klee+One:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#170b30;--card:#251645;--ink:#f3eeff;--mute:#b4a3db;--line:#3f2d68;--accent:#d3bfff;--on:#170b30;--sakura:#b08fff;--ok:#4cc38a;--no:#ff7c98;--gold:#f2cf6b;--hl:#ffd479;box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;min-height:100vh;min-height:100dvh}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 12px}h2{font-size:17px;margin:18px 0 8px}
button{cursor:pointer;font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--sakura);outline-offset:2px}
.splash{min-height:calc(100vh - 70px);min-height:calc(100dvh - 70px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px;text-align:center}
.brand{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--mute)}
.quote{background:transparent;border:0;font-size:25px;font-weight:700;line-height:1.4;padding:6px 4px;max-width:100%}
.quote small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:14px}
.go{background:var(--accent);color:var(--on);border:0;border-radius:99px;padding:22px 48px;font-size:26px;font-weight:700;box-shadow:0 8px 24px rgba(41,31,68,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px}
.menu{display:grid;gap:10px;margin-bottom:14px}
.mc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.mc .ic{font-size:30px;width:52px;height:52px;border-radius:16px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.mc b{display:block;font-size:19px}.mc span{font-size:13px;color:var(--mute)}
.mc:disabled{opacity:.55;cursor:default}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h button{background:transparent;border:0;font-size:22px;padding:4px 12px}
.cal-h b{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--mute);text-align:center}
.cell{aspect-ratio:1/1.1;border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px}
.cell small{font-size:10px;line-height:1}
.cell.t{outline:2px solid var(--ink)}
.cell.l1,.leg .l1{background:#5c3ba6!important;color:#ffffff}
.cell.l2,.leg .l2{background:#693fe6!important;color:#ffffff}
.cell.l3,.leg .l3{background:#2fb9a0!important;color:#06231e}
.cell.l4,.leg .l4{background:#f2cf6b!important;color:#2a2100}
.cell.l1 small,.cell.l2 small,.cell.l3 small,.cell.l4 small{font-size:11px;font-weight:700;line-height:1.1;margin-top:2px}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mute)}
.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px}
.day{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.day b{font-size:17px}.day span{display:block;font-size:13px;color:var(--mute);margin:2px 0 8px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sakura);transition:width .3s}
.pri{padding:14px 18px;border:0;border-radius:14px;background:var(--accent);color:var(--on);font-weight:700;width:100%;font-size:16px}
.sec{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700}
.sec[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.back{background:transparent;border:0;font-size:16px;padding:6px 0;margin-bottom:6px;font-weight:700}
ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
li{background:var(--card);border:1px solid var(--line);border-radius:12px}
.it{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;padding:8px 12px}
.it b{font-size:18px;min-width:70px}.it span{font-size:13px;color:var(--mute)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top .bar{flex:1}
.tt{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.pct{font-size:13px;color:var(--mute);min-width:38px;text-align:right}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.o{background:var(--ok)}.dots i.b{background:var(--no)}
.q{position:relative;width:100%;min-height:220px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.q .big{font-weight:700;line-height:1.2;max-width:100%;overflow-wrap:anywhere}.q .h{font-size:14px;color:var(--mute)}
.bt{background:transparent;border:0;color:inherit;font:inherit;padding:0;text-decoration:underline dotted var(--mute);text-underline-offset:10px}
mark{background:transparent;color:var(--hl)}
.lvtag{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;background:var(--line);padding:3px 10px;border-radius:99px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin-top:10px;background:var(--card);border:2px solid var(--line);border-radius:18px;font-size:22px;font-weight:700;color:var(--ink)}
.opt.m{font-size:18px}.opt:disabled{color:var(--ink);cursor:default}
.opt.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 20%,var(--card))}
.mute{color:var(--mute);font-size:14px}
.link{background:transparent;border:0;color:var(--mute);text-decoration:underline;padding:8px}
.center{text-align:center;padding:24px 8px}
.brk{text-align:center}.emo{font-size:56px;line-height:1.1;margin:4px 0}
.score{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0}
.score b{font-size:36px}.score b.g{color:var(--ok)}.score b.r{color:var(--no)}
.exp{border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:6px 14px;font-weight:700;font-size:15px;background:color-mix(in srgb,var(--gold) 12%,var(--card))}
.list{padding:2px 12px}
.rw{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px;text-align:left}
.rw:last-child{border-bottom:0}
.rw .t{flex:1;min-width:0}.rw .t b{display:block;font-size:20px}.rw .t span{font-size:13px;color:var(--mute)}
.bd{border-radius:99px;padding:7px 12px;font-size:14px;font-weight:700;white-space:nowrap}
.bd.e{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.bd.g2{background:color-mix(in srgb,var(--gold) 18%,var(--card));color:var(--gold)}
.bd.a{background:color-mix(in srgb,var(--no) 16%,var(--card));color:var(--no)}
.sticky{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px}
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.bk{position:absolute;inset:0;background:rgba(16,10,30,.55)}
.sh{position:relative;background:var(--card);color:var(--ink);width:100%;max-width:480px;max-height:86vh;overflow:auto;border-radius:24px 24px 0 0;padding:28px 16px;border:1px solid var(--line)}
.sh .x,.sh .bkb{position:absolute;top:8px;background:transparent;border:0;font-size:20px;padding:8px 12px}
.sh .x{right:6px}.sh .bkb{left:6px}
.dj{font-size:44px;font-weight:700;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.dr{text-align:center;color:var(--mute);font-size:20px}
.dm{text-align:center;font-size:22px;font-weight:700;color:var(--accent);margin:6px 0 8px}
.ctr{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--ink)}.tag.k{background:var(--ok);color:#ffffff}
.kc{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:var(--bg)}
.rel{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-top:6px;font-size:15px}
.rel span{color:var(--mute);font-size:13px}
.lnk{display:block;text-align:center;margin-top:14px;color:var(--accent);font-weight:700}
.mr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:17px}
.mv{text-align:right}.mv b{display:block;color:var(--ok);font-size:18px}.mv small{color:var(--mute);font-size:13px}
.tm{color:#654fa3;font-weight:700;margin:10px 0 0}.okt{color:var(--ok);font-weight:700;margin:10px 0 0}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
@media (prefers-color-scheme:dark){.tm{color:#a68fe6}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.go{animation:none!important}
.scene,.skyfx{display:none!important}

.v6-hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#140e3e 0,rgba(20,14,62,.9) 26%,rgba(20,14,62,.35) 56%,transparent 78%),linear-gradient(180deg,rgba(13,9,40,.7) 0,transparent 24%,transparent 70%,#0d0928 100%)}
.v6-top{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 16px 0}
.v6-logo{width:36px;height:36px;flex:none}
.v6-brand{flex:1;min-width:0}.v6-brand b{display:block;font-size:16px;font-weight:800;line-height:1.15;letter-spacing:-.01em}.v6-brand small{display:block;white-space:nowrap;font-size:10px;color:#d4c9ff;margin-top:2px}
.v6-chip{display:flex;align-items:center;gap:5px;height:36px;padding:0 10px 0 8px;border-radius:14px;background:rgba(40,28,110,.62);border:1px solid rgba(170,150,255,.45);font-size:12.5px;font-weight:800;box-shadow:inset 0 1px rgba(255,255,255,.2)}
.v6-chip svg{width:18px;height:18px}
.v6-copy{position:absolute;z-index:3;left:18px;top:88px;width:62%}
.v6-copy em{display:block;font-size:17px;font-weight:500;color:#cdbfff;font-style:italic}
.v6-copy h1{font-size:38px!important;line-height:1.08;font-weight:800;font-style:italic;letter-spacing:-.02em;margin:2px 0 0!important;color:#fff!important;text-shadow:0 4px 20px rgba(10,5,50,.7)}
.v6-sw{display:block;width:120px;height:8px;margin:5px 0 12px}
.v6-q{display:block;background:transparent;border:0;padding:0;text-align:left;font-size:12.5px;line-height:1.5;color:#e7e0ff;font-family:inherit;max-width:230px}
.v6-q span{color:#c9b0ff}
.v6-cta{margin-top:16px;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px 0 24px;border:1px solid rgba(255,255,255,.5);border-radius:99px;background:linear-gradient(120deg,#d9c0ff,#8d6cf5);color:#1c1250;font-weight:800;font-size:15px;font-family:inherit;box-shadow:0 10px 26px rgba(124,92,240,.55),inset 0 1px rgba(255,255,255,.6)}
.v6-cta svg{width:16px;height:16px}

/* stats */
.v6-stats{position:relative;z-index:4;margin-top:-26px;display:grid;grid-template-columns:repeat(4,1fr);border-radius:26px;border:1px solid rgba(180,160,255,.5);background:linear-gradient(135deg,rgba(110,88,224,.60),rgba(40,28,112,.78));box-shadow:0 16px 34px rgba(6,3,30,.45),inset 0 1px rgba(255,255,255,.25);overflow:hidden}
.v6-stats:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 56%,rgba(255,255,255,.08) 56% 66%,transparent 66%);pointer-events:none}
.v6-s{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 2px 12px;text-align:center}
.v6-s+.v6-s:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:1px;background:rgba(190,170,255,.3)}
.v6-s .i{width:34px;height:34px;margin-bottom:3px}
.v6-s b{font-size:16px;font-weight:800;line-height:1.1}.v6-s small{font-size:10.5px;color:#cfc4fa}

/* menu cards */
.v6-sec{display:flex;align-items:flex-end;justify-content:space-between;margin:26px 2px 12px}
.v6-sec h2{font-size:20px!important;font-weight:800;margin:0!important}.v6-sec .eyebrow{font-size:10px;letter-spacing:.18em;font-weight:700;margin-bottom:4px;display:block}
.v6-sec .j{font-size:26px;font-weight:700;color:rgba(190,170,255,.28)}
.v6-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.v6-c{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:12px;min-height:142px;padding:14px;text-align:left;color:#fff;font-family:inherit;border-radius:24px;border:1px solid rgba(170,150,255,.5);background:linear-gradient(135deg,rgba(108,86,222,.62),rgba(36,26,102,.82));box-shadow:0 14px 28px rgba(6,3,30,.4),inset 0 1px rgba(255,255,255,.22)}
.v6-c:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 52%,rgba(255,255,255,.09) 52% 62%,transparent 62% 72%,rgba(255,255,255,.05) 72% 78%,transparent 78%)}
.v6-c:active{transform:scale(.97);filter:brightness(1.12)}
.v6-c .i{width:54px;height:54px;flex:none;filter:drop-shadow(0 6px 10px rgba(10,5,50,.45))}
.v6-c .t{position:relative;min-width:0}.v6-c .t b{display:block;font-size:15px;font-weight:800;line-height:1.22}.v6-c .t span{display:block;font-size:11px;line-height:1.4;color:#d3c9fb;margin-top:4px}
.v6-c .a{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#9b7cff,#6a4be0);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(80,50,200,.5)}
.v6-c .a svg{width:14px;height:14px}
.v6-c.k{background:linear-gradient(135deg,rgba(86,100,228,.66),rgba(34,28,108,.84))}
.v6-c.j{background:linear-gradient(135deg,rgba(130,86,232,.66),rgba(44,26,112,.84))}
.v6-c.b{background:linear-gradient(135deg,rgba(168,86,214,.60),rgba(52,26,108,.84))}
.v6-c.v{background:linear-gradient(135deg,rgba(70,120,230,.58),rgba(30,30,110,.84))}
.v6-c.w{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:98px;padding:12px 60px 12px 14px;border-color:rgba(255,255,255,.6);background:linear-gradient(110deg,rgba(214,190,255,.95),rgba(150,120,250,.95) 60%,rgba(255,170,215,.85));color:#1c1250;box-shadow:0 14px 30px rgba(124,92,240,.45),inset 0 1px rgba(255,255,255,.7)}
.v6-c.w .t span{color:#43308f}.v6-c.w .i{width:62px;height:62px}.v6-c.w .a{background:#1c1250;top:50%;margin-top:-14px;right:16px}
.v6-cal{margin-top:6px}
.cal-h button{color:var(--ink)!important}
.cell{background:rgba(255,255,255,.06)!important;border-radius:11px!important;color:#d8d0fb}
.cell.l1{background:#5b45c8!important;color:#fff}.cell.l2{background:#7c63f0!important;color:#fff}.cell.l3{background:#b08cff!important;color:#1c1250!important}.cell.l4{background:#f0e3ff!important;color:#2a1a66!important}
.leg .l1{background:#5b45c8!important}.leg .l2{background:#7c63f0!important}.leg .l3{background:#b08cff!important}.leg .l4{background:#f0e3ff!important}
.cell.t{outline:2px solid #fff!important;box-shadow:0 0 14px rgba(201,176,255,.7)}
.reset-link{display:block;margin:18px auto 0}
.exp,.bd.g2{border-color:#d3b8ff!important;color:#e5d6ff!important;background:rgba(160,120,255,.18)!important}

/* nav bawah */
.v6-nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(230px,calc(100% - 20px));height:64px;display:grid;grid-template-columns:repeat(2,1fr);border-radius:28px;border:1px solid rgba(170,150,255,.5);background:linear-gradient(180deg,rgba(40,28,110,.92),rgba(18,12,60,.96));box-shadow:0 -6px 30px rgba(80,50,200,.3),0 14px 30px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.2)}
.v6-nav button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#b6a9ee;font-family:inherit;font-size:11px;font-weight:600}
.v6-nav button svg{width:24px;height:24px}.v6-nav .nb{position:absolute;top:6px;left:calc(50% + 9px);min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:linear-gradient(135deg,#ffb3d1,#ff8fb8);color:#2a0f3d;font-size:10.5px;font-weight:800;line-height:17px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.v6-nav .z{font-size:21px;font-weight:700;line-height:24px;height:24px}
.v6-nav button.on{color:#fff;font-weight:800}
.v6-nav button.on:after{content:"";position:absolute;left:16%;right:16%;bottom:5px;height:3px;border-radius:3px;background:linear-gradient(90deg,#8d6cf5,#d6b6ff);box-shadow:0 0 12px #9b7cff}
.v6-nav button.on svg,.v6-nav button.on .z{filter:drop-shadow(0 0 8px rgba(190,160,255,.9))}
@media(max-width:360px){.v6-copy h1{font-size:33px!important}.v6-c .t b{font-size:14px}}
.tm{color:#d8c6ff!important}.okt{color:#5be0c4!important}
li{border-radius:14px!important;overflow:hidden}
.back{margin-right:10px!important;padding:8px 14px!important}

.v6-gear{width:34px;height:34px;flex:none;border-radius:12px;background:rgba(40,28,110,.62);border:1px solid rgba(170,150,255,.45);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px rgba(255,255,255,.2)}
.v6-gear svg{width:18px;height:18px}.v6-gear:active{transform:scale(.92)}
.v6-top{gap:8px!important}.v6-brand b,.v6-brand small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v6-copy h1{overflow-wrap:anywhere}

    var w=1,a=ENG.an[id],e=ENG.sr[id],ok=a?a[9]:0,no=a?a[10]:0,p=S.p[id],po=0,pt=0,i;
    if(!KQ.got[id])w+=2;                                          /* belum pernah benar di Ketik Kanji */
    if(ok+no>0&&no/(ok+no)>=.34)w+=2;                              /* sering salah di Ketik Kanji */
    else if(!(ok+no)&&p){for(i=0;i<4;i++){po+=p[i*3+1];pt+=p[i*3+2];}if(pt>=3&&po/pt<.7)w+=1;} /* belum pernah diketik: lihat akurasi pilihan ganda (hanya dibaca) */

    ks.push({id:id,k:Math.pow(Math.random()||1e-9,1/w)});

function fntFind(id){for(var i=0;i<FNTS.length;i++)if(FNTS[i].id===id)return FNTS[i];return FNTS[0];}
function fntGet(){var v='def';try{v=localStorage.getItem(FNTK)||'def';}catch(e){}return fntFind(v).id;}
function fntApply(id){document.documentElement.style.setProperty('--fnt',fntFind(id).s);}
var fntReq=0;
function fntMark(id){
  var rows=document.querySelectorAll('.v6-row[data-a="fnt"]');
  for(var i=0;i<rows.length;i++){
    var on=rows[i].getAttribute('data-v')===id;
    rows[i].style.borderColor=on?'#d9c4ff':'';
    rows[i].style.boxShadow=on?'0 0 0 1px rgba(217,196,255,.22),0 0 18px rgba(174,137,255,.12)':'';
    var mark=rows[i].querySelector('.rc');
    if(mark)mark.textContent=on?'✓':'';
    rows[i].setAttribute('aria-pressed',on?'true':'false');
  }
}
function fntSet(id){
  var f=fntFind(id),token=++fntReq;
  try{localStorage.setItem(FNTK,f.id);}catch(e){}
  fntMark(f.id);
  /* Tunggu font pilihan siap agar Safari tidak menampilkan font fallback
     sesaat ketika keluarga font sedang dimuat. */
  var family=f.s.split(',')[0].replace(/^['"]|['"]$/g,'');
  if(document.fonts&&document.fonts.load){
    document.fonts.load('16px "'+family.replace(/"/g,'')+'"','あ漢字').then(function(){
      if(token===fntReq)fntApply(f.id);
    }).catch(function(){if(token===fntReq)fntApply(f.id);});
  }else{
    fntApply(f.id);
  }
}

/* ---------- soal ---------- */
function form(it){return{jp:it.jp,read:it.read,mean:it.mean,hl:''};}
function mkOpts(it,f,dir){
  var qf=DIRS[dir][0],af=DIRS[dir][1],pool=it.ty==='k'?KI:JI;
  var base=pool.filter(function(x){return x.id!==it.id&&x[af]!==f[af]&&x[qf]!==f[qf];});
  var same=base.filter(function(x){return x.th===it.th;});if(same.length>=3)base=same;
  if(af==='jp'){var kj=base.filter(function(x){return CJK.test(x.jp);});if(kj.length>=3)base=kj;}
  if(af==='jp'||af==='read'){var L=f[af].length,cl=base.filter(function(x){return Math.abs(x[af].length-L)<=2;});if(cl.length>=3)base=cl;}
  var arr=shuf(base.slice()),seen={},out=[];seen[f[af]]=1;
  for(var i=0;i<arr.length&&out.length<3;i++){var t=arr[i][af];if(!seen[t]){seen[t]=1;out.push({t:t,c:false});}}
  out.push({t:f[af],c:true});
  return shuf(out);
}
/* tiap item REP kali; tiap putaran diacak; dalam satu blok 7 soal item yang sama tidak boleh muncul dua kali (dijaga di nextCard) */
function build(ids,mode){
  var passes=[[],[],[]];
  ids.forEach(function(id){
    var v=validDirs(BY[id]),ds3;
    if(mode==='acak'){var sv=shuf(v.slice());ds3=sv.length>=3?sv.slice(0,3):[sv[0],sv[0],sv[0]];}
    else ds3=[mode,mode,mode];
    for(var r=0;r<3;r++)passes[r].push({id:id,dir:ds3[r]});
  });
  return shuf(passes[0]).concat(shuf(passes[1]),shuf(passes[2]));
}
function startSession(its,mode,title,from,ty,dayNo){
  var pool=its.filter(function(w){var v=validDirs(w);return mode==='acak'||mode==='tes'?v.length>0:v.indexOf(mode)>=0;});
  if(!pool.length){flash='Tidak ada item di sini yang cocok untuk cara itu. Coba Hiragana → Arti atau Acak.';return false;}
  var q,rem={},rp=(from==='test'||from==='rev')?1:REP;
  pool.forEach(function(w){rem[w.id]=rp;});
  if(from==='test'||from==='rev')q=shuf(pool.map(function(w){var v=validDirs(w);return{id:w.id,dir:v[Math.floor(Math.random()*v.length)]};}));
  else q=build(pool.map(function(w){return w.id;}),mode);
  sess={queue:q,mode:mode,title:title,from:from,ty:ty,day:dayNo||0,doneDay:0,ok:0,no:0,total:q.length,done:0,rem:rem,bad:{},chunk:[],n:0,brk:null,cur:null,f:null,pick:null,opts:[],used:{},t0:0,tp:0,lastExp:0,skipped:its.length-pool.length,ans:0};
  view='sess';det='';dstack=[];flash='';
  nextCard();
  return true;
}
function newCount(s){return s.chunk.filter(function(x){return !x.r;}).length;}
function nextCard(){
  var s=sess;s.pick=null;s.brk=null;s.tp=0;
  var ids=s.chunk.map(function(x){return x.id;}),j=-1,i,e,full=newCount(s)>=CHUNK;
  for(i=0;i<s.queue.length&&j<0;i++){e=s.queue[i];if(e.r&&s.ans>=e.at)j=i;}
  if(!full)for(i=0;i<s.queue.length&&j<0;i++){e=s.queue[i];if(!e.r&&ids.indexOf(e.id)<0)j=i;}
  for(i=0;i<s.queue.length&&j<0;i++){if(s.queue[i].r)j=i;}
  if(j<0)j=0;
  s.cur=s.queue.splice(j,1)[0]||null;
  while(s.cur&&!BY[s.cur.id])s.cur=s.queue.shift()||null;
  if(!s.cur){finishChunk('end');return;}
  var it=BY[s.cur.id];
  s.f=form(it);
  s.opts=mkOpts(it,s.f,s.cur.dir);
  s.t0=Date.now();
  window.scrollTo(0,0);
}
function finishChunk(kind){
  var s=sess,c=s.chunk.filter(function(x){return !x.r;}),ok=c.filter(function(x){return x.ok;}).length;
  s.n++;s.brk=kind;
  s.lastExp=ok*4+(c.length&&ok===c.length?2:0);
  if(kind==='rest'){
    var k=0;
    c.forEach(function(x){if(!x.ok){s.queue.unshift({id:x.id,dir:x.d,r:1,at:s.ans+3+k*2});k++;}});
  }
  S.exp=(S.exp||0)+s.lastExp;if(kind==='end'&&s.from==='day')delete S.sv[s.ty+s.day];save();
  window.scrollTo(0,0);
}
function advance(){
  var s=sess,ids=s.chunk.map(function(x){return x.id;}),pend=s.queue.some(function(x){return x.r;});
  if(!s.queue.length)finishChunk('end');
  else if(newCount(s)>=CHUNK){if(pend)nextCard();else finishChunk('rest');}
  else if(!pend&&s.queue.every(function(x){return ids.indexOf(x.id)>=0;}))finishChunk('rest');
  else nextCard();
}
function snap(){
  var s=sess;if(!s||s.from!=='day')return;
  S.sv[s.ty+s.day]=JSON.parse(JSON.stringify({mode:s.mode,title:s.title,ty:s.ty,day:s.day,queue:s.queue,ok:s.ok,no:s.no,total:s.total,done:s.done,rem:s.rem,bad:s.bad,chunk:s.chunk,n:s.n,used:s.used,skipped:s.skipped,ans:s.ans}));
}
function resume(){
  var o=S.sv[cty+day];if(!o)return;
  var c=JSON.parse(JSON.stringify(o));
  c.queue=(c.queue||[]).filter(function(e){return BY[e.id];});
  if(!c.queue.length){delete S.sv[cty+day];save();return;}
  sess={queue:c.queue,mode:c.mode,title:c.title,from:'day',ty:c.ty,day:c.day,doneDay:0,ok:c.ok,no:c.no,total:c.total,done:c.done,rem:c.rem,bad:c.bad,chunk:c.chunk.filter(function(x){return !x.r;}).length>=CHUNK?[]:c.chunk,n:c.n,brk:null,cur:null,f:null,pick:null,opts:[],used:c.used,t0:0,tp:0,lastExp:0,skipped:c.skipped,ans:c.ans};
  view='sess';det='';dstack=[];flash='';
  nextCard();
}
function answer(i){
  var s=sess;if(!s||!s.cur||s.brk||s.pick!==null)return;
  var cur=s.cur,w=BY[cur.id],good=!!s.opts[i].c,sec=(Date.now()-s.t0)/1000;
  s.pick=i;s.ans++;s.chunk.push({id:w.id,ok:good,t:sec,jp:s.f.jp,read:s.f.read,mean:s.f.mean,hl:s.f.hl,r:cur.r?1:0,d:cur.dir});
  S.tsum=(S.tsum||0)+Math.min(sec,20);S.tcnt=(S.tcnt||0)+1;
  engRec(w.id,s.from==='day'?'d':s.from==='test'?'t':'r',good,sec);
  if(s.from==='day'){
    var q=stat(w.id,cur.dir);q[2]++;if(good){q[1]++;q[0]++;}else q[0]=0;setStat(w.id,cur.dir,q);
    if(!S.cd[s.ty+s.day]&&dayDone(s.ty,s.day)){S.cd[s.ty+s.day]=1;s.doneDay=s.day;}
  }
  if(good){s.ok++;s.done++;s.rem[w.id]--;}
  else{
    s.no++;s.bad[w.id]=true;
    s.queue.splice(Math.min(s.queue.length,3),0,{id:w.id,dir:cur.dir,r:1,at:s.ans+3+Math.floor(Math.random()*2)});
  }
  if(s.from==='day')snap();
  save();
  render();
  if(good){setTimeout(function(){if(sess===s&&s.cur===cur&&s.pick===i&&!s.brk&&view==='sess'){advance();render();}},700);}
}

var BEX=[["Dipakai untuk meminta atau menyuruh dengan sopan. Kata kerja bentuk て + ください.","ここに名前を書いてください。","Koko ni namae o kaite kudasai.","Tolong tulis nama di sini."],["Menyatakan sedang melakukan sesuatu, atau kebiasaan/keadaan yang berlangsung.","今、ご飯を食べています。","Ima, gohan o tabete imasu.","Sekarang saya sedang makan."],["Menawarkan bantuan: \"bagaimana kalau saya...?\". Ganti ます dengan ましょうか.","荷物を持ちましょうか。","Nimotsu o mochimashō ka.","Mau saya bawakan barangnya?"],["Meminta atau memberi izin. Pertanyaannya: ～てもいいですか.","ここで写真をとってもいいですか。","Koko de shashin o totte mo ii desu ka.","Bolehkah memotret di sini?"],["Menyatakan larangan keras.","ここでたばこを吸ってはいけません。","Koko de tabako o sutte wa ikemasen.","Tidak boleh merokok di sini."],["Melakukan A dulu, setelah selesai baru B.","手を洗ってから、食べます。","Te o aratte kara, tabemasu.","Setelah cuci tangan, saya makan."],["Meminta orang lain untuk tidak melakukan sesuatu.","ここに入らないでください。","Koko ni hairanaide kudasai.","Tolong jangan masuk ke sini."],["Menyatakan kewajiban. Ubah ない menjadi なければ, lalu tambah なりません.","毎日、薬を飲まなければなりません。","Mainichi, kusuri o nomanakereba narimasen.","Saya harus minum obat setiap hari."],["Menyatakan tidak perlu melakukan sesuatu.","明日は来なくてもいいです。","Ashita wa konakute mo ii desu.","Besok tidak perlu datang."],["Menyatakan kemampuan. Kata kerja bentuk kamus + こと + ができます.","私は日本語を話すことができます。","Watashi wa nihongo o hanasu koto ga dekimasu.","Saya bisa berbicara bahasa Jepang."],["Dipakai untuk menyebut hobi: kata kerja bentuk kamus + ことです.","趣味は本を読むことです。","Shumi wa hon o yomu koto desu.","Hobi saya membaca buku."],["\"Sebelum melakukan...\". Kata kerja sebelum まえに selalu bentuk kamus.","寝るまえに、歯をみがきます。","Neru mae ni, ha o migakimasu.","Sebelum tidur, saya menyikat gigi."],["Menyatakan pendapat atau dugaan. Bagian sebelum と memakai bentuk biasa.","明日は雨が降ると思います。","Ashita wa ame ga furu to omoimasu.","Saya pikir besok akan hujan."],["Menyatakan alasan (karena), lebih halus daripada から. Kata sifat-な dan nomina memakai な.","熱があるので、休みます。","Netsu ga aru node, yasumimasu.","Karena demam, saya istirahat."],["\"Apakah ... atau tidak\", dipakai di dalam kalimat.","彼が来るかどうか、わかりません。","Kare ga kuru ka dō ka, wakarimasen.","Saya tidak tahu apakah dia datang atau tidak."],["Mencoba melakukan sesuatu untuk melihat hasilnya.","この料理を食べてみます。","Kono ryōri o tabete mimasu.","Saya akan coba makan masakan ini."],["Melakukan sesuatu untuk orang/hewan yang kedudukannya lebih rendah (adik, anak, hewan).","弟に宿題を教えてやります。","Otōto ni shukudai o oshiete yarimasu.","Saya mengajari adik PR-nya."],["Menerima tindakan dari orang yang dihormati. Sangat sopan.","先生に日本語を教えていただきます。","Sensei ni nihongo o oshiete itadakimasu.","Saya diajari bahasa Jepang oleh guru."],["Orang yang dihormati melakukan sesuatu untuk saya. Sopan.","先生が本を貸してくださいます。","Sensei ga hon o kashite kudasaimasu.","Guru meminjamkan buku kepada saya."],["Menyatakan tujuan (\"untuk/demi\"). Kata kerja bentuk kamus atau nomina + の.","日本で働くために、勉強します。","Nihon de hataraku tame ni, benkyō shimasu.","Saya belajar untuk bekerja di Jepang."],["Menyatakan kegunaan sesuatu. Biasanya diikuti 便利, いい, 必要, dll.","この箱は荷物を入れるのに便利です。","Kono hako wa nimotsu o ireru no ni benri desu.","Kotak ini praktis untuk menaruh barang."],["\"Terlalu\". Dipasang di akar kata kerja ます atau kata sifat tanpa い/な.","食べすぎました。","Tabesugimashita.","Saya makan terlalu banyak."],["\"Kelihatannya akan/tampak\" berdasarkan yang terlihat. Pakai akar ます.","雨が降りそうです。","Ame ga furisō desu.","Sepertinya akan hujan."],["Menyatakan mudah dilakukan. Akar ます + やすい.","このペンは書きやすいです。","Kono pen wa kakiyasui desu.","Pulpen ini mudah dipakai menulis."],["Menyatakan sulit dilakukan. Akar ます + にくい.","この漢字は読みにくいです。","Kono kanji wa yominikui desu.","Kanji ini sulit dibaca."],["\"Padahal\": hasilnya tidak sesuai harapan.","薬を飲んだのに、治りません。","Kusuri o nonda noni, naorimasen.","Padahal sudah minum obat, tidak sembuh."],["Pergi melakukan sesuatu lalu kembali ke tempat semula.","コンビニでお茶を買ってきます。","Konbini de ocha o katte kimasu.","Saya beli teh di minimarket lalu kembali."],["Membuat sesuatu menjadi. Kata sifat-い: い → く. Kata sifat-な/nomina: に.","部屋を明るくします。","Heya o akaruku shimasu.","Saya membuat kamar jadi terang."],["Baru akan melakukan (sebentar lagi).","これから出かけるところです。","Korekara dekakeru tokoro desu.","Saya baru akan pergi."],["Sedang berada di tengah-tengah melakukan sesuatu.","今、ご飯を食べているところです。","Ima, gohan o tabete iru tokoro desu.","Sekarang saya sedang makan."],["Baru saja selesai melakukan sesuatu (beberapa saat lalu).","今、帰ったところです。","Ima, kaetta tokoro desu.","Saya baru saja pulang."],["Baru saja melakukan, dengan perasaan \"belum lama\". Bisa juga untuk waktu agak lama.","日本に来たばかりです。","Nihon ni kita bakari desu.","Saya baru saja datang ke Jepang."],["Dugaan kuat berdasarkan alasan: \"seharusnya\".","彼はもう家に着いたはずです。","Kare wa mō ie ni tsuita hazu desu.","Dia seharusnya sudah sampai di rumah."],["Menyampaikan kabar dari orang lain atau berita: \"katanya\". Beda dengan そう (kelihatannya), yang ini pakai bentuk biasa.","天気予報によると、明日は雨だそうです。","Tenki yohō ni yoru to, ashita wa ame da sō desu.","Menurut ramalan cuaca, katanya besok hujan."],["Dugaan dari yang dilihat atau didengar: \"sepertinya\".","田中さんは疲れているようです。","Tanaka-san wa tsukarete iru yō desu.","Tanaka sepertinya lelah."],["Menyebut nama atau mengutip ucapan: \"berkata/bernama\".","私はサリと言います。","Watashi wa Sari to iimasu.","Nama saya Sari."],["Dugaan (\"mungkin\") atau meminta persetujuan (\"kan?\").","明日は晴れるでしょう。","Ashita wa hareru deshō.","Besok mungkin cerah."],["\"Ketika\". Kata sifat-な dan nomina memakai な / の sebelum とき.","日本へ来たとき、十八歳でした。","Nihon e kita toki, jūhassai deshita.","Ketika datang ke Jepang, saya berumur 18 tahun."],["Kalau A terjadi, B pasti terjadi (hasil otomatis/hukum alam).","このボタンを押すと、お湯が出ます。","Kono botan o osu to, oyu ga demasu.","Kalau tombol ini ditekan, air panas keluar."],["Saya melakukan sesuatu untuk orang lain (setara/lebih rendah).","友達に地図をかいてあげます。","Tomodachi ni chizu o kaite agemasu.","Saya menggambarkan peta untuk teman."],["Orang lain melakukan sesuatu untuk saya (saya yang menerima).","友達が荷物を持ってくれました。","Tomodachi ga nimotsu o motte kuremashita.","Teman membawakan barang saya."],["Saya menerima tindakan dari orang lain (\"dilakukan oleh\").","友達に写真を見せてもらいました。","Tomodachi ni shashin o misete moraimashita.","Saya diperlihatkan foto oleh teman."],["\"Kalau/jika\". Kata kerja bentuk た + ら. Bisa untuk kondisi dan urutan kejadian.","雨が降ったら、行きません。","Ame ga futtara, ikimasen.","Kalau hujan, saya tidak pergi."],["\"Walaupun\" ... tetap.","雨が降っても、行きます。","Ame ga futte mo, ikimasu.","Walaupun hujan, saya tetap pergi."],["Dipakai untuk menjelaskan alasan atau meminta penjelasan.","どうしたんですか。頭が痛いんです。","Dō shita n desu ka. Atama ga itai n desu.","Ada apa? Kepala saya sakit."],["Permintaan yang sangat sopan: \"maukah Anda ...?\".","少し手伝っていただけませんか。","Sukoshi tetsudatte itadakemasen ka.","Maukah Anda membantu sedikit?"],["Meminta saran: \"sebaiknya bagaimana?\".","駅までどう行ったらいいですか。","Eki made dō ittara ii desu ka.","Sebaiknya bagaimana pergi ke stasiun?"],["Bentuk potensial: \"bisa\". Gol. 2: る → られる.","私は納豆が食べられます。","Watashi wa nattō ga taberaremasu.","Saya bisa makan natto."],["\"Hanya\". Selalu dipakai bersama bentuk negatif.","お金が千円しかありません。","Okane ga sen-en shika arimasen.","Uang saya hanya seribu yen."],["\"Sambil\". Kegiatan utama ada di bagian belakang kalimat. Akar ます + ながら.","音楽を聞きながら、勉強します。","Ongaku o kikinagara, benkyō shimasu.","Saya belajar sambil mendengar musik."],["Menyebutkan beberapa alasan atau hal: \"dan juga\".","このレストランは安いし、おいしいです。","Kono resutoran wa yasui shi, oishii desu.","Restoran ini murah dan juga enak."],["Selesai melakukan sesuatu, atau terlanjur (ada rasa menyesal).","かさを忘れてしまいました。","Kasa o wasurete shimaimashita.","Payungnya terlanjur tertinggal."],["Keadaan sebagai hasil tindakan yang disengaja seseorang (kata kerja transitif + が).","窓が開けてあります。","Mado ga akete arimasu.","Jendelanya (sudah) dibuka."],["Melakukan sesuatu lebih dulu sebagai persiapan.","旅行の前に、ホテルを予約しておきます。","Ryokō no mae ni, hoteru o yoyaku shite okimasu.","Sebelum berlibur, saya pesan hotel dulu."],["Berniat melakukan. Kata kerja bentuk maksud (意向形) + と思っています.","来年、日本で働こうと思っています。","Rainen, Nihon de hatarakō to omotte imasu.","Tahun depan saya berniat bekerja di Jepang."],["Menyatakan rencana. Kata kerja bentuk kamus + つもり.","夏休みに国へ帰るつもりです。","Natsuyasumi ni kuni e kaeru tsumori desu.","Saya berencana pulang kampung saat liburan musim panas."],["Menyatakan sesuatu yang sudah dijadwalkan.","来週、日本へ行く予定です。","Raishū, Nihon e iku yotei desu.","Minggu depan jadwalnya saya pergi ke Jepang."],["Memberi saran: \"sebaiknya\". Kata kerja bentuk た + ほうがいいです.","熱があるなら、休んだほうがいいです。","Netsu ga aru nara, yasunda hō ga ii desu.","Kalau demam, sebaiknya istirahat."],["Saran agar tidak melakukan: \"sebaiknya jangan\".","夜遅く、コーヒーを飲まないほうがいいです。","Yoru osoku, kōhī o nomanai hō ga ii desu.","Sebaiknya jangan minum kopi larut malam."],["Menyatakan kemungkinan: \"mungkin\".","明日は雪が降るかもしれません。","Ashita wa yuki ga furu kamo shiremasen.","Besok mungkin turun salju."],["Menjelaskan arti suatu kata atau tulisan.","「禁煙」は、たばこを吸わないという意味です。","「Kin-en」 wa, tabako o suwanai to iu imi desu.","「Kin-en」 artinya tidak merokok."],["Menyampaikan ucapan orang lain: \"dia bilang ...\".","田中さんは、明日休むと言っていました。","Tanaka-san wa, ashita yasumu to itte imashita.","Tanaka bilang dia libur besok."],["Meminta orang menyampaikan pesan.","山田さんに、会議は三時だと伝えてください。","Yamada-san ni, kaigi wa sanji da to tsutaete kudasai.","Tolong sampaikan ke Yamada bahwa rapat jam tiga."],["\"Sesuai/seperti\" yang disebut atau dilihat.","先生が言ったとおりにやりました。","Sensei ga itta tōri ni yarimashita.","Saya melakukannya sesuai yang dikatakan guru."],["\"Setelah\". Kata kerja bentuk た + あとで.","食事をしたあとで、薬を飲みます。","Shokuji o shita ato de, kusuri o nomimasu.","Setelah makan, saya minum obat."],["\"Tanpa melakukan\". Kata kerja bentuk ない + で.","朝ご飯を食べないで、会社へ行きました。","Asagohan o tabenaide, kaisha e ikimashita.","Saya pergi kerja tanpa sarapan."],["\"Supaya/agar\". Sering dipakai dengan bentuk potensial atau negatif.","忘れないように、メモします。","Wasurenai yō ni, memo shimasu.","Saya mencatat supaya tidak lupa."],["Perubahan keadaan: menjadi bisa atau menjadi terbiasa.","日本語が話せるようになりました。","Nihongo ga hanaseru yō ni narimashita.","Saya jadi bisa berbicara bahasa Jepang."],["Menjadi tidak (lagi) bisa/melakukan sesuatu.","目が悪くなって、本が読めなくなりました。","Me ga waruku natte, hon ga yomenaku narimashita.","Mata saya memburuk, jadi tidak bisa membaca buku."],["Berusaha melakukan sesuatu secara teratur atau sebisanya.","毎日、運動するようにしています。","Mainichi, undō suru yō ni shite imasu.","Saya berusaha berolahraga setiap hari."],["Mengubah kegiatan menjadi subjek kalimat. Kata kerja bentuk kamus + の.","日本語を話すのは難しいです。","Nihongo o hanasu no wa muzukashii desu.","Berbicara bahasa Jepang itu sulit."],["Dipakai dengan 好き, 上手, 下手, dll. untuk menyatakan suka atau pandai melakukan sesuatu.","私は歌うのが好きです。","Watashi wa utau no ga suki desu.","Saya suka menyanyi."],["Menyatakan lupa melakukan sesuatu.","窓を閉めるのを忘れました。","Mado o shimeru no o wasuremashita.","Saya lupa menutup jendela."]];

function kqNorm(s){

var KQR=(function(){
  var m={},V='aiueo',rows={'':'あいうえお','k':'かきくけこ','s':'さしすせそ','t':'たちつてと','n':'なにぬねの','h':'はひふへほ','m':'まみむめも','y':'や_ゆ_よ','r':'らりるれろ','w':'わ___を','g':'がぎぐげご','z':'ざじずぜぞ','d':'だぢづでど','b':'ばびぶべぼ','p':'ぱぴぷぺぽ'},c,i,k;
  for(c in rows)for(i=0;i<5;i++)if(rows[c].charAt(i)!=='_')m[c+V.charAt(i)]=rows[c].charAt(i);
  ['k','g','n','h','m','r','b','p'].forEach(function(c){var b=m[c+'i'];m[c+'ya']=b+'ゃ';m[c+'yu']=b+'ゅ';m[c+'yo']=b+'ょ';});
  [['sh','し'],['ch','ち'],['j','じ'],['sy','し'],['ty','ち'],['zy','じ'],['dy','ぢ'],['jy','じ']].forEach(function(p){m[p[0]+'a']=p[1]+'ゃ';m[p[0]+'u']=p[1]+'ゅ';m[p[0]+'o']=p[1]+'ょ';});

function kqRomaji(s){
  s=String(s).toLowerCase().replace(/\s+/g,'');

  while(i<n){
    ch=s.charAt(i);nx=s.charAt(i+1);
    if(ch==='-'){o+='ー';i++;continue;}
    if(ch==="'"){i++;continue;}
    if(ch==='n'){
      if(nx==='n'&&!/[aiueoy]/.test(s.charAt(i+2))){o+='ん';i+=2;continue;}
      if(!nx||!/[aiueoy]/.test(nx)){o+='ん';i++;if(s.charAt(i)==="'")i++;continue;}
    }
    if(nx===ch&&/[bcdfghjkmpqrstwyz]/.test(ch)){o+='っ';i++;continue;}
    t=null;
    for(L=3;L>=1&&!t;L--){if(KQR[s.substr(i,L)]){t=KQR[s.substr(i,L)];i+=L;}}
